# Facto stack demo - Valentus (lean) + client Mermaid + diagram-lightbox + SoftNav.
# Published: https://antora-supplemental.github.io/facto-stack/
# Demo content protocol: demo-data theme-demo (baseline) + demo/docs (stack-only).
#   https://github.com/antora-supplemental/demo-data/blob/main/README.adoc
#   https://docs.antora-supplemental.org/docs/proposals/demo-data-catalog/
site:
  title: Facto stack demo
  url: https://antora-supplemental.github.io/facto-stack
  start_page: home::index.adoc
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://antora-supplemental.github.io/facto-stack/sitemap.xml
  keys:
    footerNote: 'Facto stack demo (Mermaid client, lightbox, SoftNav) — not Valentus core.'

urls:
  html_extension_style: indexify

content:
  sources:
    # Baseline body fixtures (demo-data theme-demo — host-agnostic AsciiDoc catalog)
    - url: https://github.com/antora-supplemental/demo-data.git
      tags: [v0.2.1]
      branches: []
      start_path: docs/theme-demo
    # Optional site-nav-tree forest smoke (catalog-alpha, catalog-beta):
    # - url: https://github.com/antora-supplemental/demo-data.git
    #   branches: main
    #   start_path: docs/fixtures/site-nav-tree
    - url: ./..
      start_path: demo/home
      branches: HEAD
    - url: ./..
      start_path: demo/docs
      branches: HEAD

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

antora:
  extensions:
    - ./lib/verify-themed-svg-dark-mode.js
    - require: '@antora-supplemental/facto-stack'
      profile: demo
      siteNavTree:
        enabled: true
        include: [home, stack, theme-demo]
        order: [home, stack, theme-demo]
      linkValidator:
        reportEmail: support@devcentr.org
      orphanFinder:
        reportEmail: support@devcentr.org
        failOnUnresolved: false

asciidoc:
  attributes:
    source-highlighter: highlight.js
    icons: font
    stem: latexmath
    mermaid-client: ''
    mermaid-client-mode: client
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    page-context-active: ''

output:
  dir: build/site

runtime:
  fetch: true