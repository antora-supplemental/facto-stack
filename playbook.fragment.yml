# Fragment - paste under your playbook root (merge with existing keys).
# facto-stack: Valentus stays the UI bundle; this file is the extras composer.
#
# Preferred (one playbook require → footer lists "facto-stack" only):
#
# antora:
#   extensions:
#     - require: '@antora-supplemental/facto-stack'
#       linkValidator:
#         reportEmail: you@example.org
#       pageContextAntora:
#         component: docs
#         path: keywords
#
# Legacy explicit list (below) remains for copy-paste reference.

# Folder URLs: index.adoc → …/email/ (canonical + sitemap follow Antora page URL).
urls:
  html_extension_style: indexify

antora:
  extensions:

    # Option B (stack demo path): client Mermaid + lightbox instead of / alongside Kroki bake.
    # See demo/playbook.yml and https://antora-supplemental.github.io/facto-stack/
    # - require: '@antora-supplemental/mermaid-client/antora'
    #   injectAssets: true
    # - require: '@antora-supplemental/diagram-lightbox'
    #   injectAssets: true
    - '@antora/lunr-extension'
    - '@antora-supplemental/antora-search-chat'
    # Bare /component/ for versioned components. Default short_circuit_single
    # aliases a single numbered version through; set it false for a one-item chooser.
    - require: '@antora-supplemental/unversioned-component-urls'
      mode: selector
    # Multi-component hubs: curated sidebar forest (keeps default nav-tree JS).
    # Prefer `include` allowlist — content.sources ≠ forest roots.
    # - require: '@antora-supplemental/site-nav-tree'
    #   filter: true
    #   include: [home, general-knowledge, business-bootstrap]
    #   order: [home, general-knowledge, business-bootstrap]
    # Compose pack (one require): siteNavTree: { enabled: true, include: [...], order: [...] }
    - require: '@antora-supplemental/nav-typology'
    - require: '@antora-supplemental/nav-typology-diataxis'
    - '@antora-supplemental/build-stack'
    # Move page-context lead into [data-zone="meta"] (requires zoned article.hbs).
    - '@antora-supplemental/article-zones'
    # Bake View | Edit into header zone (no runtime icon JS).
    - '@antora-supplemental/page-edit'
    # Link every page to the org's other docs sites (team, partners, ...) via a generated
    # registry page. Say `sites: none` when there are none (hides it, no log).
    - require: '@antora-supplemental/related-docs'
      sites: none
      # sites:
      #   - name: Team docs
      #     url: https://team.docs.example.org
      #     audience: team
      #     requires_login: true
    # Named link registry: each shared outside link lives once as a {url-...} attribute.
    # Warns on literal uses at build time and publishes _/link-registry/index.json
    # (every outbound URL, its name, the pages that use it). CI gate: the link-registry
    # reusable workflow as a first job (see examples/workflows/build-and-deploy.yml).
    - require: '@antora-supplemental/link-registry'
      # registry: ./docs/link-registry.adoc   # .adoc attributes file, injected into every component
      # prefix: url-                          # only url-* attributes count as links
      # warn_literals: true
      # index: true
      # index_path: _/link-registry/index.json
    # Outbound http(s) link validation + triage page under /link-validator/
    - require: '@antora-supplemental/link-validator'
      reportEmail: support@devcentr.org
      softFail403: true
      failLevel: none
    # Click-time link UX (Wayback + optional live probe)
    - require: '@antora-supplemental/linkinator'
      statusDefault: unchecked
    # List installed supplemental extensions (footer layout)
    - require: '@antora-supplemental/extension-lister'
      layouts: [footer]
    - require: '@antora-supplemental/orphan-finder/extension'
      reportEmail: support@devcentr.org
      failOnUnresolved: false
    # Keyword / tag listing pages: /{component}/keywords/{slug}/
    - require: '@antora-supplemental/page-context/antora'
      component: home
      path: keywords

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v3/ui-bundle.zip
    snapshot: true
  # supplemental_files: ./supplemental-ui  # brand + site-math.js/css; optional site-mermaid.js fallback
  # With site-nav-tree + Valentus: also copy site-nav-tree ui/partials/nav-menu.hbs into supplemental-ui/partials/
  # nav-typology @ v0.1.12+ injects companion UI (no supplemental copy)
  # With build-stack: copy ui/partials/footer-build-stack.hbs; {{> footer-build-stack}} in footer-content.hbs

asciidoc:
  extensions:
    # Interim until Antora + asciidoctor-emoji 1.x on @asciidoctor/core 4
    - '@antora-supplemental/asciidoctor-emoji-literals'
    - asciidoctor-emoji
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    # Suppress page-context hard-coded fallbacks in page bodies (attrs still required)
    page-context-active: ''
    # Must match page-context/antora host component + path (no trailing slash)
    page-context-keyword-base: '/home/keywords'