# Fragment - paste under your playbook root (merge with existing keys).
# facto-stack: Valentus stays the UI bundle; this file is the extras composer.

# Folder URLs: index.adoc → …/email/ (canonical + sitemap follow Antora page URL).
urls:
  html_extension_style: indexify

antora:
  extensions:

    # Option B (stack demo path): client Mermaid + lightbox instead of / alongside Kroki bake.
    # See demo/playbook.yml and https://antora-supplemental.github.io/facto-stack/
    # - require: '@antora-supplemental/mermaid-client/antora'
    #   injectAssets: true
    # - require: '@antora-supplemental/diagram-lightbox'
    #   injectAssets: true
    - '@antora/lunr-extension'
    # Multi-component hubs: curated sidebar forest (keeps default nav-tree JS).
    # Prefer `include` allowlist — content.sources ≠ forest roots.
    # - require: '@antora-supplemental/site-nav-tree'
    #   include: [home, general-knowledge, business-bootstrap]
    #   order: [home, general-knowledge, business-bootstrap]
    - require: '@antora-supplemental/nav-typology'
    - require: '@antora-supplemental/nav-typology-diataxis'
    - '@antora-supplemental/build-stack'
    # Bake View | Edit into page-context lead table (no runtime icon JS).
    - '@antora-supplemental/page-edit'
    # Outbound http(s) link validation + triage page under /link-validator/
    - require: '@antora-supplemental/link-validator'
      reportEmail: support@devcentr.org
      softFail403: true
      failLevel: none
    # Click-time link UX (Wayback + optional live probe)
    - require: '@antora-supplemental/linkinator'
      statusDefault: unchecked
    # List installed supplemental extensions (footer layout)
    - require: '@antora-supplemental/extension-lister'
      layouts: [footer]
    - require: '@antora-supplemental/orphan-finder/extension'
      reportEmail: support@devcentr.org
      failOnUnresolved: false
    # Keyword / tag listing pages: /{component}/keywords/{slug}/
    - require: '@antora-supplemental/page-context/antora'
      component: home
      path: keywords

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  # supplemental_files: ./supplemental-ui  # brand + site-math.js/css; optional site-mermaid.js fallback
  # With site-nav-tree + Valentus: also copy site-nav-tree ui/partials/nav-menu.hbs into supplemental-ui/partials/
  # With nav-typology: copy nav-tree partial, helpers, css, svg into supplemental-ui/
  # With build-stack: copy ui/partials/footer-build-stack.hbs; {{> footer-build-stack}} in footer-content.hbs

asciidoc:
  extensions:
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    # Suppress page-context hard-coded fallbacks in page bodies (attrs still required)
    page-context-active: ''
    # Must match page-context/antora host component + path (no trailing slash)
    page-context-keyword-base: '/home/keywords'